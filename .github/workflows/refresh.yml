name: Refresh drop-in schedule
on:
  schedule:
    - cron: "15 9 * * *"   # 5:15 am Toronto (EDT), every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_data.py
      - name: Commit if changed
        run: |
          git config user.name "drop-in-now bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json tools/geo_cache.json
          git diff --cached --quiet || git commit -m "Refresh drop-in schedule"
          git push
